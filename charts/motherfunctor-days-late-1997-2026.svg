<title id="title">Last on time? 1996.</title>
<desc id="desc">Bar chart of days late for fiscal years 1997 through 2026. Fiscal year 1997 was completed September 30, 1996, one day before its start, shown as zero days late. Every subsequent fiscal year finished late. Fiscal year 2026 uses April 30; separate immigration-enforcement funding followed June 10.</desc>
